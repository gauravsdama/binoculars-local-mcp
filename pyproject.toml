[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "binoculars-local-mcp"
version = "0.1.0"
description = "Local-only Binoculars detector exposed as an MCP server"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE.md", "NOTICE.md"]
authors = [{ name = "Gaurav Dama" }]
keywords = ["ai-text-detection", "mcp", "offline", "local-first"]
dependencies = [
  "mcp>=1.13,<2",
  "numpy>=1.26,<3",
  "pydantic>=2.11,<3",
  "sentencepiece>=0.2,<1",
  "torch>=2.2,<3",
  "transformers>=5.10,<6",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.8,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
binoculars-mcp = "binoculars.mcp_server:main"

[tool.setuptools.packages.find]
include = ["binoculars*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
# B615 assumes from_pretrained receives a remote model ID. This project validates
# existing directories and also sets local_files_only, disables remote code, and
# installs a process-wide connection guard.
skips = ["B615"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
